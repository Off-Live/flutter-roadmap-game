name: roadmap_game
description: "2D Roadmap Game - iOS only"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  path_parsing: ^1.0.1
  path_drawing: ^1.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/map/
    - assets/map/safari_world_map.json
    - assets/map/safari_world_map_svg.json
    - assets/map/aqua_world_map.json
    - assets/map/aqua_map.jpeg
    - assets/image/
